<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to Poison Candy Game!</h1>
    <p id="intro">Please select the game mode you want to play </p>
    <div id="mode-container">
        <button id="mode-bot">PLAY VS COMPUTER</button>
        <button id="mode-friend">PLAY WITH FRIEND</button>
    </div>
    <div id="score-container">Coins: <span id="coins-count">0</span>🪙</div>
    <button id="shop-btn">Shop</button>
    <div id="game-board"></div>
    <div id="game-over-screen"><h1>Game Over</h1>
     <button id="restart-btn">Play again</button>   
    </div>
    <div id="shop" class="shop-screen">
        <div class="content">
            <span class="close-shop">&times;</span>
            <h2>Skin shop</h2>
            <p>Choose your skin:</p>

            <div class="shop-tems">
            <button id="skin-candy" class="skin-btn"   data-skin="🍬" data-price="0">Candies (For free)</button>
            <button id="skin-fruit" class="skin-btn"   data-skin="🍓" data-price="15">Fruits (15 🪙)</button>
            <button id="skin-crystal" class="skin-btn" data-skin="💎" data-price="30">Daimons (30 🪙)</button>  
            </div>
        </div>
    </div>
      <script src="javascript.js"></script>
</body>
</html>
